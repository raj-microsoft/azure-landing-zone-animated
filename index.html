  <script nonce="ee07c61ba4c1663e461371ed8a64132b0d93">
    (()=>{'use strict';
      const steps=[];const duration=2200;let index=0;let timer=null;let playing=false;
      const edges=[...document.querySelectorAll('[data-edge-id]')];
      const caption=document.getElementById('caption');const counter=document.getElementById('counter');
      const play=document.getElementById('play');const previous=document.getElementById('previous');const next=document.getElementById('next');const restart=document.getElementById('restart');
      const reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;document.documentElement.dataset.reducedMotion=String(reduced);
      function render(){const step=steps[index];const active=new Set(step?.edgeIds||[]);const filter=active.size>0;edges.forEach(edge=>edge.setAttribute('opacity',!filter||active.has(edge.getAttribute('data-edge-id'))?'1':'0.12'));caption.textContent=step?.caption||'No scenario steps';counter.textContent=steps.length?(index+1)+' / '+steps.length:'';previous.disabled=!steps.length||index===0;next.disabled=!steps.length||index===steps.length-1;restart.disabled=!steps.length;play.disabled=steps.length<2;}
      function stop(){playing=false;if(timer!==null){window.clearInterval(timer);timer=null}play.textContent='Play';}
      function show(nextIndex){if(!steps.length)return;index=Math.max(0,Math.min(steps.length-1,nextIndex));render();}
      function start(){if(steps.length<2)return;playing=true;play.textContent='Pause';timer=window.setInterval(()=>{index=(index+1)%steps.length;render()},duration);}
      play.addEventListener('click',()=>playing?stop():start());previous.addEventListener('click',()=>{stop();show(index-1)});next.addEventListener('click',()=>{stop();show(index+1)});restart.addEventListener('click',()=>{stop();show(0)});render();
    })();
