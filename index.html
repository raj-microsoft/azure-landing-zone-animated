    *{box-sizing:border-box}html,body{height:100%;margin:0}body{display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:var(--bg);color:var(--fg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--surface)}

    footer{display:flex;align-items:center;justify-content:center;gap:12px;padding:10px 16px;border-top:1px solid var(--border);background:var(--surface)}
    .scenario{min-width:0;max-width:min(680px,50vw)}.counter{color:var(--muted);font:11px ui-monospace,monospace}.caption{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
    .controls{display:flex;gap:6px}button{min-height:34px;border:1px solid var(--border);border-radius:8px;background:#1a1f29;color:var(--fg);padding:0 12px;font:600 12px inherit;cursor:pointer}button:hover{border-color:var(--accent)}button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button:disabled{cursor:not-allowed;opacity:.45}.primary{border-color:var(--accent);background:var(--accent);color:#04141a}
    [data-edge-id]{transition:opacity .18s ease}
    @media(max-width:720px){header{align-items:flex-start}.offline{display:none}footer{align-items:stretch;flex-direction:column}.scenario{max-width:100%;text-align:center}.controls{justify-content:center;flex-wrap:wrap}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition-duration:.001ms!important;animation-duration:.001ms!important}}

      const steps=[{"id":"step_1","caption":"1. An internet user reaches Front Door: global edge with WAF","edgeIds":["e_https"],"dir":"forward","token":"request"},{"id":"step_2","caption":"2. Application Gateway routes the request to App Service","edgeIds":["e_waf","e_route"],"dir":"forward","token":"request"},{"id":"step_3","caption":"3. App Service reads its secrets from Key Vault","edgeIds":["e_secrets"],"dir":"forward","token":"request"},{"id":"step_4","caption":"4. All outbound traffic is forced through Azure Firewall in the hub","edgeIds":["e_egress"],"dir":"forward","token":"request"},{"id":"step_5","caption":"5. Corporate users sign in with Entra ID","edgeIds":["e_signin"],"dir":"forward","token":"request"},{"id":"step_6","caption":"6. On-premises traffic enters Azure over ExpressRoute","edgeIds":["e_private","e_er"],"dir":"forward","token":"request"},{"id":"step_7","caption":"7. The firewall inspects it and routes into the Corp spoke","edgeIds":["e_inspect","e_spoke"],"dir":"forward","token":"request"},{"id":"step_8","caption":"8. VMs query Azure SQL and resolve names via Private DNS","edgeIds":["e_sql","e_dns"],"dir":"forward","token":"request"},{"id":"step_9","caption":"9. Admins reach VMs only through Azure Bastion, no public IPs","edgeIds":["e_admin"],"dir":"forward","token":"request"},{"id":"step_10","caption":"10. Firewall and SQL logs flow to Log Analytics; Defender raises alerts","edgeIds":["e_fwlogs","e_sqllogs","e_alerts"],"dir":"forward","token":"request"},{"id":"step_11","caption":"11. Azure Policy enforces guardrails on both landing zones","edgeIds":["e_pol_corp","e_pol_online"],"dir":"forward","token":"request"}];const duration=2200;let index=0;let timer=null;let playing=false;
      const edges=[...document.querySelectorAll('[data-edge-id]')];
      const caption=document.getElementById('caption');const counter=document.getElementById('counter');
      const play=document.getElementById('play');const previous=document.getElementById('previous');const next=document.getElementById('next');const restart=document.getElementById('restart');
      const reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;document.documentElement.dataset.reducedMotion=String(reduced);
      function render(){const step=steps[index];const active=new Set(step?.edgeIds||[]);const filter=active.size>0;edges.forEach(edge=>edge.setAttribute('opacity',!filter||active.has(edge.getAttribute('data-edge-id'))?'1':'0.12'));caption.textContent=step?.caption||'No scenario steps';counter.textContent=steps.length?(index+1)+' / '+steps.length:'';previous.disabled=!steps.length||index===0;next.disabled=!steps.length||index===steps.length-1;restart.disabled=!steps.length;play.disabled=steps.length<2;}
      function stop(){playing=false;if(timer!==null){window.clearInterval(timer);timer=null}play.textContent='Play';}

    })();
